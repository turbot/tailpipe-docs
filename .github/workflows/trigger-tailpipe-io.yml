name: Trigger the preview build in tailpipe.io

on:
  workflow_dispatch:

  push:
    branches-ignore: 
      - "main"

  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Create a token for the Turbot Web Builds app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WEB_BUILDS_APP_CLIENT_ID }}
          private-key: ${{ secrets.WEB_BUILDS_APP_PRIVATE_KEY }}
          owner: turbot
          repositories: tailpipe.io

      - name: Start the preview build in tailpipe.io
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCS_REF_NAME: ${{ github.ref_name }}
        run: |
          default_branch="$(gh api repos/turbot/tailpipe.io --jq .default_branch)"
          gh workflow run build-preview.yml -R turbot/tailpipe.io --ref "$default_branch" \
            -f ref_name="$DOCS_REF_NAME"


  comment-link:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
    steps:
      - name: Get the deployment details
        id: get_deployment_details
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const branchName = `docs/${process.env.PR_HEAD_REF}`;

            const response = await fetch('https://tailpipe-io.vercel.app/api/service/deploy-details', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ${{ secrets.TAILPIPE_API_KEY }}',
              },
              body: JSON.stringify({ branch: branchName }),
            });
            if (!response.ok) {
              core.setOutput('foundDeployment', false);
            } else {
              const data = await response.json();
              core.setOutput('foundDeployment', true);
              core.setOutput('apiResponse', data);
            }

      - name: Add comment with preview link
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: ${{ steps.get_deployment_details.outputs.foundDeployment == 'true' }}
        with:
          script: |
            const apiResponse = ${{ steps.get_deployment_details.outputs.apiResponse }};

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Available 🚀\n\n**Commit Author:** ${apiResponse.meta.githubCommitAuthorName}\n**Commit Message:** ${apiResponse.meta.githubCommitMessage}\n\n**Preview Link:** [${apiResponse.meta.branchAlias}](https://${apiResponse.meta.branchAlias})`
            });